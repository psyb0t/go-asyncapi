name: pipeline

# A Go library: no image, no binaries. Every branch push runs lint, the tests
# with the coverage gate and the security scan in the dev image, and validates
# the agent skill. A push to main then refreshes the badges. A v* tag does not
# rerun the checks: it waits for that commit's main run to succeed, cuts the
# GitHub release from the annotated tag message, publishes the skill to
# ClawHub, and refreshes the badges with the main run's coverage.
on:
  push:
  # Weekly run that refreshes the imported-by badge. pkg.go.dev updates its
  # importer count over days, so once a week is enough. It runs the whole
  # pipeline because the badge job republishes every badge from that run's
  # results, coverage included.
  #
  # The minute and hour come from a hash of the repo name, so this repo's run
  # does not queue at the same moment as every other scheduled job.
  schedule:
    - cron: "29 14 * * 2"
  workflow_dispatch:

permissions: {}

jobs:
  # make lint, make test-coverage and make sec all run inside the Dockerfile.dev
  # image, so the runner needs only Docker and Make. No credentials.
  code:
    if: "!startsWith(github.ref, 'refs/tags/')"
    permissions:
      contents: read
      security-events: write # uploads the security scan SARIF
    uses: psyb0t/reusable-github-workflows/.github/workflows/code-workflow.yml@master
    with:
      lint_command: "make lint"
      test_command: "make test-coverage"
      sec_command: "make sec"
      coverage_file: "coverage-percent.txt"
      sarif_file: "sec.sarif"
      sarif_category: "go"

  wait:
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      actions: read
    uses: psyb0t/reusable-github-workflows/.github/workflows/wait-for-default-branch.yml@master

  release:
    needs: [wait]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/release-workflow.yml@master

  # Tag runs read the coverage artifact from the main run they release.
  badges:
    needs: [code, wait]
    if: "always() && ((github.ref_name == github.event.repository.default_branch && needs.code.result == 'success') || (startsWith(github.ref, 'refs/tags/') && needs.wait.result == 'success'))"
    permissions:
      contents: write
      actions: read # cross-run coverage artifact download on tags
    uses: psyb0t/reusable-github-workflows/.github/workflows/create-badges.yml@master
    with:
      coverage: true
      coverage_run_id: ${{ needs.wait.outputs.run_id }}
      importers: true

  # Validates the agent skill after the checks on every branch push, and
  # validates and publishes it to ClawHub after the release on a tag push.
  publish-to-clawhub:
    needs: [code, release]
    if: "always() && (needs.code.result == 'success' || needs.release.result == 'success')"
    permissions:
      contents: read
    uses: psyb0t/reusable-github-workflows/.github/workflows/clawhub-publish.yml@master
    with:
      skill_names: '["go-asyncapi"]'
      plugin_names: "[]"
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
