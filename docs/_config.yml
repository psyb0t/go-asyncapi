title: go-asyncapi
tagline: AsyncAPI 3 documents as Go structs
description: A Go library that loads AsyncAPI 3 documents in YAML or JSON and returns servers, channels, operations and messages, with every $ref followed across files and every trait merged.
lang: en
url: https://psyb0t.github.io
baseurl: /go-asyncapi
repository: psyb0t/go-asyncapi
author: Ciprian Mandache

remote_theme: just-the-docs/just-the-docs@v0.12.0
color_scheme: mocha

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
  - jekyll-include-cache

permalink: pretty

relative_links:
  enabled: true
  collections: false

defaults:
  - scope:
      path: ""
    values:
      layout: default
      seo:
        type: TechArticle

search:
  heading_level: 3

aux_links:
  GitHub:
    - https://github.com/psyb0t/go-asyncapi
aux_links_new_tab: true

nav_external_links:
  - title: Changelog
    url: https://github.com/psyb0t/go-asyncapi/blob/main/CHANGELOG.md

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/psyb0t/go-asyncapi
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: tree
